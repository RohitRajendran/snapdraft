<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #f5f0e8;
        font-family: 'Courier New', monospace;
        display: flex;
        align-items: stretch;
      }

      .left {
        width: 500px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 64px 56px;
      }

      .logo {
        font-family: 'Courier New', monospace;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #2c2c2c;
        margin-bottom: 36px;
      }

      .headline {
        font-family: 'Courier New', monospace;
        font-size: 58px;
        font-weight: 700;
        line-height: 1.08;
        color: #1a1714;
        margin-bottom: 28px;
      }

      .tagline {
        font-family: 'Courier New', monospace;
        font-size: 18px;
        color: #1a1714;
        line-height: 1.6;
      }

      .right {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f0e8;
        position: relative;
        overflow: hidden;
      }
    </style>
  </head>
